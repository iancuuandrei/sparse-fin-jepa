name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.13"
      - run: uv sync --frozen --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --frozen --no-sync --no-build python -m ruff check src tests scripts
      - run: uv run --frozen --no-sync --no-build python -m ruff format --check src tests scripts
      - run: uv run --frozen --no-sync --no-build python -m mypy src
      - run: uv run --frozen --no-sync --no-build python scripts/repo_context.py --check
      - run: uv run --frozen --no-sync --no-build python -m pytest -q --cov=execsim --cov-report=term-missing
