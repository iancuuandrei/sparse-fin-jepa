[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-cost-sim"
version = "1.0.0"
description = "Point-in-time optimal-execution research framework for minute-bar simulation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26.0,<2.4",
  "pandas>=2.2.0",
  "PyYAML>=6.0",
  "pyarrow>=15.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
data = [
  "alpaca-py>=0.43.0",
  "exchange-calendars>=4.5",
]
optimization = [
  "osqp>=0.6.5",
  "scipy>=1.11.0",
]
reporting = [
  "matplotlib>=3.8.0",
  "tabulate>=0.9.0",
]
ml = [
  "scikit-learn>=1.4.0",
]
lightgbm = [
  "lightgbm==4.7.0",
]
deep = [
  "scipy>=1.11.0",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "threadpoolctl>=3.1.0",
]
paper = [
  "threadpoolctl>=3.1.0",
  "alpaca-py>=0.43.0",
  "exchange-calendars>=4.5",
  "lightgbm==4.7.0",
  "matplotlib>=3.8.0",
  "osqp>=0.6.5",
  "safetensors==0.8.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "tabulate>=0.9.0",
  "torch==2.13.0",
]
dev = [
  "alpaca-py>=0.43.0",
  "exchange-calendars>=4.5",
  "hypothesis>=6.100",
  "matplotlib>=3.8.0",
  "lightgbm==4.7.0",
  "mypy>=1.10",
  "osqp>=0.6.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "scikit-learn>=1.4.0",
  "scipy>=1.11.0",
  "safetensors==0.8.0",
  "tabulate>=0.9.0",
  "torch==2.13.0",
]

[project.scripts]
execsim = "execsim.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["execsim"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
